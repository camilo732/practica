<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="t d">
  <title id="t">Libros apilados junto a una taza y una planta</title>
  <desc id="d">Ilustración plana de una pequeña biblioteca doméstica con libros de colores.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3ebdd"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5d50"/>
      <stop offset="1" stop-color="#23463c"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7791f"/>
      <stop offset="1" stop-color="#8a5a00"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#245c7a"/>
      <stop offset="1" stop-color="#173f54"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="500" height="400" rx="30" fill="url(#wall)"/>
  <circle cx="420" cy="86" r="54" fill="#b7791f" opacity=".14"/>
  <circle cx="94" cy="330" r="42" fill="#2f5d50" opacity=".1"/>

  <!-- estantería -->
  <rect x="62" y="86" width="396" height="12" rx="6" fill="#c8b9a0"/>
  <rect x="62" y="304" width="396" height="14" rx="7" fill="#c8b9a0"/>

  <!-- libros verticales -->
  <g>
    <rect x="92" y="134" width="34" height="170" rx="5" fill="url(#bookA)"/>
    <rect x="98" y="150" width="22" height="6" rx="3" fill="#f3ebdd" opacity=".85"/>
    <rect x="98" y="166" width="22" height="4" rx="2" fill="#f3ebdd" opacity=".55"/>

    <rect x="130" y="112" width="40" height="192" rx="5" fill="url(#bookB)"/>
    <rect x="138" y="130" width="24" height="8" rx="4" fill="#fffdf8" opacity=".9"/>
    <circle cx="150" cy="164" r="9" fill="#fffdf8" opacity=".75"/>

    <rect x="174" y="150" width="30" height="154" rx="5" fill="#e7efeb"/>
    <rect x="180" y="166" width="18" height="5" rx="2.5" fill="#2f5d50" opacity=".55"/>
    <rect x="180" y="180" width="18" height="4" rx="2" fill="#2f5d50" opacity=".35"/>

    <rect x="208" y="122" width="36" height="182" rx="5" fill="url(#bookC)"/>
    <rect x="216" y="142" width="20" height="6" rx="3" fill="#fffdf8" opacity=".85"/>
    <rect x="216" y="158" width="20" height="4" rx="2" fill="#fffdf8" opacity=".5"/>
  </g>

  <!-- libros tumbados -->
  <g>
    <rect x="270" y="266" width="150" height="20" rx="6" fill="#23463c"/>
    <rect x="284" y="242" width="122" height="18" rx="6" fill="#b7791f"/>
    <rect x="276" y="220" width="136" height="16" rx="6" fill="#e7efeb"/>
    <rect x="294" y="204" width="104" height="14" rx="6" fill="#245c7a"/>
    <rect x="288" y="250" width="110" height="5" rx="2.5" fill="#fffdf8" opacity=".5"/>
  </g>

  <!-- taza -->
  <g transform="translate(408 214)">
    <rect x="0" y="20" width="58" height="58" rx="12" fill="#fffdf8" stroke="#c8b9a0" stroke-width="4"/>
    <path d="M56 34c18 0 18 26 0 26" fill="none" stroke="#c8b9a0" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 8c0-8 8-8 8-16M30 8c0-8 8-8 8-16" fill="none" stroke="#c8b9a0" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- planta -->
  <g transform="translate(428 248)">
    <path d="M22 58V22" stroke="#2f5d50" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 36C8 36 2 24 2 14c14 0 20 10 20 22Z" fill="#2f5d50"/>
    <path d="M22 28c14 0 20-12 20-22C28 6 22 16 22 28Z" fill="#4a7c6b"/>
    <path d="M4 58h36l-5 22H9L4 58Z" fill="#b7791f"/>
  </g>

  <!-- detalle -->
  <circle cx="66" cy="60" r="5" fill="#b7791f"/>
  <circle cx="84" cy="60" r="5" fill="#2f5d50" opacity=".55"/>
</svg>
