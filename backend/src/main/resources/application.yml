spring:
  application:
    name: librolog

  # Carga el archivo .env de la raíz si existe. Los secretos nunca se escriben
  # en este archivo: se leen de variables de entorno o del .env (ignorado por Git).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/librolog_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  servlet:
    multipart:
      # Los CSV de Goodreads pueden superar 1 MB en bibliotecas grandes.
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}
  frontend-dir: ${APP_FRONTEND_DIR:../frontend}
  admin:
    # Correos separados por coma que reciben el rol ADMIN al arrancar.
    emails: ${APP_ADMIN_EMAILS:}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500}
  security:
    require-https: ${APP_REQUIRE_HTTPS:false}
    # HSTS: se desactiva en el perfil dev para no fijar localhost a HTTPS.
    hsts-enabled: ${APP_HSTS_ENABLED:true}
    # Peticiones por minuto y por IP en /api/auth/** antes de devolver 429.
    auth-rate-limit-per-minute: ${APP_AUTH_RATE_LIMIT:20}
    # Intentos fallidos antes de bloquear la cuenta y minutos de bloqueo.
    max-failed-attempts: ${APP_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${APP_LOCK_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  openlibrary:
    base-url: ${OPENLIBRARY_BASE_URL:https://openlibrary.org}
    user-agent: "${OPENLIBRARY_USER_AGENT:LibroLog/1.0 (academico)}"
    # Tiempos de espera cortos: si la API pública no responde se usa la caché.
    connect-timeout-ms: ${OPENLIBRARY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${OPENLIBRARY_READ_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    com.librolog: INFO
